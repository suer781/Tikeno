name: Android CI

on:
  push:
    branches: [ main, workbuddy ]
  pull_request:
    branches: [ main, workbuddy ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Debug - verify Google Maven reachability
        run: |
          echo "--- dl.google.com POM status ---"
          curl -sS -o /dev/null -w '%{http_code}\n' "https://dl.google.com/android/maven2/com/android/application/com.android.application.gradle.plugin/8.7.3/com.android.application.gradle.plugin-8.7.3.pom" || echo "curl failed"
          echo "--- services.gradle.org status ---"
          curl -sS -o /dev/null -w '%{http_code}\n' "https://services.gradle.org/" || echo "curl failed"

      - name: Build Debug APK (含 NDK/CMake 编译)
        run: ./gradlew :app:assembleDebug --info --stacktrace

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tikeno-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tikeno-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: tikeno-native-symbols
          path: app/build/intermediates/cxx/**/obj/**/*.so
          if-no-files-found: ignore
