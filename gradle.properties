# Tikeno — Gradle 全局配置（架构 §2.1 #3）
# 本机经 TLS 拦截代理上网，Java 默认信任库不含代理 CA；
# 追加 WINDOWS-ROOT 让 JVM 信任 Windows 证书库（依赖解析需要）
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT -Dfile.encoding=GBK -Dsun.jnu.encoding=GBK
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.defaults.buildfeatures.buildconfig=true
# 工程路径含中文（…\自制连点器\…），覆盖 AGP 的非 ASCII 路径检查
android.overridePathCheck=true
kotlin.code.style=official
